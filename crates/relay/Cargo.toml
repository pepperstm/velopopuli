[package]
name = "velopopuli-relay"
version = "0.3.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Group-ride relay for VeloPopuli: passes riders' positions between everyone in a room."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
