name: Hardware report
description: Tell us how your trainer or sensor works with VeloPopuli — working or not
labels: [hardware]
body:
  - type: input
    id: device
    attributes:
      label: Device (make and model)
      placeholder: "Wahoo KICKR Core, Garmin HRM-Pro…"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [Bluetooth, ANT+ stick]
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Works fully, Works partly, Doesn't work]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What worked and what didn't — connecting, power, cadence, speed, resistance changes, ERG, drop-outs. Attach a diagnostics report if anything misbehaved.
  - type: input
    id: system
    attributes:
      label: System and VeloPopuli version
      placeholder: "macOS 15, VeloPopuli 0.2.0"
