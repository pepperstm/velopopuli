name: Build

on:
  push:
    branches: [main]
    # A version tag (v0.2.0) also publishes a GitHub Release with every installer.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Jobs only read the repository. The release job asks for write access itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The app crate (src-tauri) needs these to compile, so its tests can run.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The repository's formatting (rustfmt.toml, .prettierrc.json); fix with `npm run format`.
      - run: cargo fmt --all --check
      - run: npx prettier --check "web/src/**/*.{ts,tsx,css}"
      - run: cargo test --workspace
      - name: Tag matches the version
        # v0.4.0 and its release candidates (v0.4.0-rc.1, -rc.2, …) are built from version 0.4.0.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",/\1/p' src-tauri/tauri.conf.json | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in tauri.conf.json"
            exit 1
          fi

  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS (Apple silicon + Intel)
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: Windows
            args: --bundles msi,nsis
          - os: ubuntu-22.04
            name: Linux
            args: --bundles deb,appimage
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release version
        # A release build reports its tag (0.4.0-rc.1, say) in diagnostics and bug reports.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VP_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Intel target for the universal Mac build
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - run: npx tauri build ${{ matrix.args }}
      - name: Update information in the AppImage
        # So AppImageUpdate and similar tools can update it from the latest release (or, for a
        # release candidate, from the newest release of any kind).
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" packaging/appimage-update-info.sh target/release/bundle/appimage/VeloPopuli_*_amd64.AppImage
      - name: Relay server
        run: cargo build --release -p velopopuli-relay
      - uses: actions/upload-artifact@v4
        with:
          name: VeloPopuli-${{ runner.os }}
          path: |
            target/universal-apple-darwin/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.AppImage.zsync
            target/release/velopopuli-relay
            target/release/velopopuli-relay.exe
          if-no-files-found: warn

  arch:
    # Repackages the Debian build as a native Arch package, then installs it on a clean Arch
    # system and checks every library the app needs is there.
    needs: app
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VeloPopuli-Linux
          path: linux
      - name: Build the package
        run: |
          pacman -Syu --noconfirm --needed pacman-contrib
          version=$(sed -n 's/^  "version": "\(.*\)",/\1/p' src-tauri/tauri.conf.json | head -1)
          useradd -m builder
          mkdir /build && cp packaging/arch/PKGBUILD /build/
          sed -i "s/^pkgver=.*/pkgver=$version/" /build/PKGBUILD
          cp "$(find linux -name '*.deb' | head -1)" "/build/VeloPopuli_${version}_amd64.deb"
          cp LICENSE "/build/LICENSE-${version}"
          chown -R builder /build
          cd /build
          su builder -c "updpkgsums && makepkg --nodeps --noconfirm"
          ls -la /build
      - name: Install it and check its libraries
        run: |
          pacman -U --noconfirm /build/velopopuli-bin-*.pkg.tar.zst
          pacman -Ql velopopuli-bin
          desktop=$(ls /usr/share/applications/*.desktop | head -1)
          bin=$(sed -n 's/^Exec=\([^ ]*\).*/\1/p' "$desktop" | head -1)
          bin=$(command -v "$bin" || echo "$bin")
          echo "launcher $desktop runs $bin"
          missing=$(ldd "$bin" | grep 'not found' || true)
          echo "$missing"
          test -z "$missing"
          test -f /usr/lib/udev/rules.d/99-velopopuli-ant.rules
      - uses: actions/upload-artifact@v4
        with:
          name: VeloPopuli-Arch
          path: |
            /build/*.pkg.tar.zst
            /build/PKGBUILD

  relay-image:
    # The relay as a container image on GitHub's registry. Every run checks that it builds;
    # a version tag also publishes it, for Intel/AMD and ARM (a Raspberry Pi, ARM servers).
    needs: test
    name: Relay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          # GitHub shows the description from the multi-platform index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/velopopuli-relay
          # 0.4.0 and 0.4.0-rc.1 by version. `latest` moves only with full releases;
          # `next` moves with every release, release candidates included.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=next,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=VeloPopuli relay
            org.opencontainers.image.description=Group-ride relay for VeloPopuli, the free, open-source indoor cycling app. Passes riders' positions between everyone in a room.
          annotations: |
            org.opencontainers.image.description=Group-ride relay for VeloPopuli, the free, open-source indoor cycling app. Passes riders' positions between everyone in a room.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/relay.Dockerfile
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=relay-image
          cache-to: type=gha,scope=relay-image,mode=max

  release:
    # Only for version tags: gather everything into one GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, arch]
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the files
        run: |
          mkdir out
          find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.AppImage.zsync' -o -name '*.pkg.tar.zst' -o -name 'PKGBUILD' \) -exec cp {} out/ \;
          # The relay has the same name on every system; tell them apart.
          relay() { find "artifacts/VeloPopuli-$1" -type f -name "$2" | head -1; }
          cp "$(relay macOS velopopuli-relay)" out/velopopuli-relay-macos-arm64
          cp "$(relay Linux velopopuli-relay)" out/velopopuli-relay-linux-x86_64
          cp "$(relay Windows velopopuli-relay.exe)" out/velopopuli-relay-windows-x86_64.exe
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - name: Release notes
        # A release candidate says so at the top of its notes.
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            final=${GITHUB_REF_NAME%%-*}
            {
              echo "> **Release candidate.** This is a test build of VeloPopuli ${final#v}, for trying the new features before the full release. Things may still change or break. Please report anything that goes wrong with **Report a problem → Report on GitHub** in the app. For everyday riding, use the [latest full release](https://github.com/pepperstm/velopopuli/releases/latest)."
              echo
              cat packaging/RELEASE_NOTES.md
            } > notes.md
          else
            cp packaging/RELEASE_NOTES.md notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: VeloPopuli ${{ github.ref_name }}
          body_path: notes.md
          # A suffix (v0.4.0-rc.1) makes a pre-release; plain versions become the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Releases are immutable once published, so the files go up while it's a draft…
          draft: true
          files: out/*
      - name: Publish it
        # …and it's published once they're all there.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
