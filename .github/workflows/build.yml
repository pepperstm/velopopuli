name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p velopopuli-core -p velopopuli-relay
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (Apple silicon + Intel)
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: Windows
            args: --bundles msi,nsis
          - os: ubuntu-22.04
            name: Linux
            args: --bundles deb,appimage
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Intel target for the universal Mac build
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - run: npx tauri build ${{ matrix.args }}
      - name: Relay server
        run: cargo build --release -p velopopuli-relay
      - uses: actions/upload-artifact@v4
        with:
          name: VeloPopuli-${{ runner.os }}
          path: |
            target/universal-apple-darwin/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/velopopuli-relay
            target/release/velopopuli-relay.exe
          if-no-files-found: warn
